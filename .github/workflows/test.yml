name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Image bauen
        run: docker build -t klarfall:ci .
      - name: Container starten und prüfen
        run: |
          docker run -d --name kf -p 3000:3000 -e BASE_URL=http://localhost:3000 klarfall:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/config && break; sleep 1; done
          curl -fs http://localhost:3000/ | grep -q Klarfall
          curl -fs http://localhost:3000/app/ | grep -q Klarfall
          curl -fs http://localhost:3000/portal/ | grep -q Klarfall
          docker logs kf
      - name: Caddy-Konfiguration prüfen
        run: docker run --rm -e DOMAIN=example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
