# Startet Klarfall mit HTTPS (Caddy holt das Zertifikat automatisch).
# Vorher in .env: DOMAIN=eure-domain.de und BASE_URL=https://eure-domain.de
services:
  klarfall:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - klarfall-data:/data
    # nur intern erreichbar, nach außen geht alles über Caddy
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - klarfall
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  klarfall-data:
  caddy-data:
  caddy-config:
