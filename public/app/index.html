<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4FD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klarfall">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<title>Klarfall App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body{display:flex;justify-content:center}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] textarea,[dir=rtl] button,[dir=rtl] select{font-family:'Noto Sans Arabic',Inter,system-ui,sans-serif}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] .top b,[dir=rtl] .hero b{font-family:'Noto Sans Arabic',sans-serif;letter-spacing:0}
#app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;background:#1F4FD8;color:#fff}
.top b{font:700 20px 'Space Grotesk',sans-serif;flex:1}
.top button,.top select{min-width:44px;min-height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font:600 14px Inter,sans-serif;padding:0 10px;cursor:pointer;width:auto}
.top select option{color:#0F172A}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.foot{position:sticky;bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px}
.foot .btn{flex:1}
.hero{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:20px;background:#1F4FD8;color:#fff;border:0;text-align:start;font:inherit;cursor:pointer}
.hero b{font:700 28px 'Space Grotesk',sans-serif}
.it{display:flex;flex-direction:column;gap:4px;text-align:start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;width:100%}
.prog{height:6px;border-radius:3px;background:var(--line)}.prog i{display:block;height:6px;border-radius:3px;background:var(--blue)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex:none}
.cam{position:relative}.cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
.doc{max-height:280px;overflow:auto;padding:14px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.5;direction:ltr;text-align:left}
.doc p+p{margin-top:8px}
.pad{width:100%;height:170px;border-radius:14px;border:2px dashed var(--line);background:#fff;touch-action:none;display:block}
.ai{border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
</style>
</head>
<body>
<div id="app"><div class="body"><p class="mut">…</p></div></div>
<script src="/assets/api.js"></script>
<script src="/assets/i18n-app.js"></script>
<script>
{
const {esc,eur,dt,STATUS,api,shrink,fileGrid}=KF;
const I=window.KF_I18N,DE=I.de;
const app=document.getElementById('app');
const LANGS=Object.keys(I);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const guess=()=>{const l=(store.get('kf_lang')||navigator.language||'de').slice(0,2);return LANGS.includes(l)?l:'de'};
const S={lang:guess(),me:null,cfg:{},view:'home',authMode:'login',cases:[],cur:null,step:0,d:null,label:DE.labels[4],msg:'',busy:false,vtext:null,sig:null};
const t=()=>I[S.lang];
const tr=(arrKey,val)=>{const i=DE[arrKey].indexOf(val);return i>=0?t()[arrKey][i]:val};
const st=s=>t().status[s]||s;
const evText=e=>{if(e.kind==='status')return e.text.replace(/^Status: (.*)$/,(m,x)=>'Status: '+st(x));if(e.kind==='msg')return e.text;for(const[r,v]of(t().ev||[]))if(r.test(e.text))return e.text.replace(r,v);return e.text};
const pill=s=>KF.pill(s).replace('>'+esc(s)+'<','>'+esc(st(s))+'<');
const localNow=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const blank=()=>({type:'',when:localNow(),place:'',own_plate:'',injured:'Nein',police:'',opp_plate:'',opp_ins:'',opp_name:'',opp_phone:'',witness:'',text:'',fault:'',has_rs:'',expert_pref:'Video',needs_tow:false,needs_repair:true,needs_car:false,commercial:false,photos:[]});
S.d=blank();
const NSTEPS=6;
let poll=null;

function setLang(l){S.lang=l;store.set('kf_lang',l);document.documentElement.lang=l;document.documentElement.dir=I[l].dir;if(S.me)api('/api/me',{method:'PATCH',json:{lang:l}}).catch(()=>{})}
const langSel=()=>`<label class="sr" for="lang">${esc(t().language)}</label><select id="lang">${LANGS.map(l=>`<option value="${l}"${l===S.lang?' selected':''}>${l.toUpperCase()}</option>`).join('')}</select>`;
const fv=(k,v)=>`value="${esc(v)}" data-f="${k}"`;
const top=(title,back)=>`<div class="top">${back?`<button data-go="${back}" aria-label="${esc(t().back)}">${S.lang==='ar'?'→':'←'}</button>`:''}<b>${esc(title)}</b>${langSel()}${S.me&&!back?`<button data-go="account">${esc(t().account)}</button>`:''}</div>`;
const msgBox=()=>S.msg?`<div class="note ${S.msg.ok?'ok':'err'}" role="status">${esc(S.msg.t)}</div>`:'';
const opt=(k,arrKey)=>`<div class="opts">${DE[arrKey].map((v,i)=>`<button type="button" class="opt" data-set="${k}" data-v="${esc(v)}" aria-pressed="${S.d[k]===v}">${esc(t()[arrKey][i])}</button>`).join('')}</div>`;
const labelled=files=>files.map(f=>({...f,label:f.label==='Vollmacht (unterschrieben)'?t().steps[5]:tr('labels',f.label)}));
const signBlock=()=>`<div class="doc" lang="de">${S.vtext?`<b>${esc(S.vtext.title)}</b>${S.vtext.paras.map(p=>`<p>${esc(p)}</p>`).join('')}`:'…'}</div>
  <p class="sm mut">${esc(t().sign_legal)}</p>
  <div><div class="row"><span class="l" style="font-weight:600;font-size:14px">${esc(t().sign_here)}</span><button type="button" class="btn b2" id="sigclear" style="min-height:36px">${esc(t().sign_clear)}</button></div><canvas class="pad" id="pad" aria-label="${esc(t().sign_here)}"></canvas></div>`;

const V={
auth:()=>`<div class="top"><b>Klarfall</b>${langSel()}</div><div class="auth" style="width:100%"><div class="card">
  <h1>${esc(S.authMode==='login'?t().login:t().register)}</h1>${msgBox()}
  <form id="authf" style="display:flex;flex-direction:column;gap:12px">
    ${S.authMode==='register'?`<div><label class="l" for="a_name">${esc(t().name)}</label><input id="a_name" type="text" autocomplete="name" required></div><div><label class="l" for="a_phone">${esc(t().phone)}</label><input id="a_phone" type="tel" autocomplete="tel"></div>`:''}
    <div><label class="l" for="a_mail">${esc(t().email)}</label><input id="a_mail" type="email" autocomplete="email" required dir="ltr"></div>
    <div><label class="l" for="a_pw">${esc(S.authMode==='register'?t().pw_min:t().password)}</label><input id="a_pw" type="password" autocomplete="${S.authMode==='login'?'current-password':'new-password'}" required dir="ltr"></div>
    <button class="btn wide" type="submit">${esc(S.authMode==='login'?t().login:t().register)}</button>
  </form>
  <button class="btn b2 wide" data-auth="${S.authMode==='login'?'register':'login'}">${esc(S.authMode==='login'?t().to_register:t().to_login)}</button>
  <p class="sm mut">${esc(t().auth_hint)} <a href="/#melden">${esc(t().auth_hint_link)}</a>.</p>
</div></div>`,
home:()=>`${top('Klarfall')}<div class="body">${msgBox()}
  <button class="hero" data-go="new"><span class="pill" style="background:rgba(255,255,255,.18);color:#fff;align-self:flex-start">24/7</span><b>${esc(t().report)}</b><span>${esc(t().report_sub)}</span></button>
  <div class="card warn"><b>${esc(t().emergency)}</b></div>
  <h2>${esc(t().my_cases)}</h2>
  ${S.cases.length?S.cases.map(c=>`<button class="it" data-open="${c.id}"><div class="row"><b dir="ltr">${esc(c.no)}</b>${pill(c.status)}</div><span class="sm">${esc(tr('types',c.type))} · ${dt(c.when_ts)}</span><span class="sm mut">${esc(c.own_plate||'')} ${c.place?'· '+esc(c.place):''}</span></button>`).join(''):`<div class="card empty">${esc(t().no_cases)}</div>`}
</div>`,
new:()=>{
  const d=S.d,n=S.step,T=t();
  const ok=[true,!!(d.type&&d.place.trim()),d.photos.length>0,true,!!d.has_rs,true][n];
  const pages=[
  ()=>`<h1>${esc(T.safety_title)}</h1><div class="card" style="padding:4px 14px">${T.safety.map((s,i)=>`<label class="chk"${i===3?' style="border:0"':''}><input type="checkbox">${esc(s)}</label>`).join('')}</div>`,
  ()=>`<h1>${esc(T.what_happened)}</h1>${opt('type','types')}
    <div class="two"><div><label class="l" for="f_when">${esc(T.when)}</label><input id="f_when" type="datetime-local" ${fv('when',d.when)}></div><div><label class="l" for="f_plate">${esc(T.own_plate)}</label><input id="f_plate" type="text" autocomplete="off" dir="ltr" ${fv('own_plate',d.own_plate)}></div></div>
    <div><label class="l" for="f_place">${esc(T.where)}</label><div style="display:flex;gap:8px"><input id="f_place" type="text" placeholder="${esc(T.where_ph)}" ${fv('place',d.place)}>${navigator.geolocation?`<button type="button" class="btn b2" id="gps" style="flex:none">${esc(T.gps)}</button>`:''}</div></div>
    <div class="two"><div><label class="l">${esc(T.injured)}</label>${opt('injured','yesno')}</div><div><label class="l" for="f_pol">${esc(T.police_no)}</label><input id="f_pol" type="text" dir="ltr" ${fv('police',d.police)}></div></div>`,
  ()=>{const have=new Set(d.photos.map(p=>p.label));return `<h1>${esc(T.photos)}</h1><p class="sm mut">${esc(T.photos_hint)}</p>
    <div class="opts" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${DE.labels.map((l,i)=>`<button type="button" class="opt" data-lbl="${esc(l)}" aria-pressed="${S.label===l}">${have.has(l)?'✓ ':''}${esc(T.labels[i])}</button>`).join('')}</div>
    <label class="btn wide cam">${esc(T.take_photo(tr('labels',S.label)))}<input type="file" id="cap" accept="image/*" capture="environment"></label>
    <label class="btn b2 wide cam">${esc(T.gallery)}<input type="file" id="gal" accept="image/*,video/*,application/pdf" multiple></label>
    ${fileGrid(labelled(d.photos),true)}`},
  ()=>`<h1>${esc(T.opp_title)}</h1>
    <div class="two"><div><label class="l" for="f_op">${esc(T.opp_plate)}</label><input id="f_op" type="text" autocomplete="off" dir="ltr" ${fv('opp_plate',d.opp_plate)}></div><div><label class="l" for="f_oi">${esc(T.opp_ins)}</label><input id="f_oi" type="text" ${fv('opp_ins',d.opp_ins)}></div>
    <div><label class="l" for="f_on">${esc(T.opp_name)}</label><input id="f_on" type="text" ${fv('opp_name',d.opp_name)}></div><div><label class="l" for="f_ot">${esc(T.opp_phone)}</label><input id="f_ot" type="tel" dir="ltr" ${fv('opp_phone',d.opp_phone)}></div></div>
    <div><label class="l" for="f_wi">${esc(T.witnesses)}</label><input id="f_wi" type="text" ${fv('witness',d.witness)}></div>
    <div><div class="row"><label class="l" for="f_tx" style="margin:0">${esc(T.what_text)}</label>${SR?`<button type="button" class="btn b2" id="mic" style="min-height:38px">${esc(rec?T.stop:T.speak)}</button>`:''}</div><textarea id="f_tx" data-f="text" style="margin-top:6px">${esc(d.text)}</textarea></div>
    <div><label class="l">${esc(T.fault_q)}</label>${opt('fault','fault')}</div>`,
  ()=>`<h1>${esc(T.almost)}</h1>
    <div class="card"><b>${esc(T.rs_q)}</b>${opt('has_rs','rs')}<span class="sm mut">${esc(T.guarantee(d.has_rs==='Ja'?'300 €':'500 €'))}</span></div>
    <div class="card"><b>${esc(T.expert)}</b>${opt('expert_pref','expert_opts')}</div>
    <div class="card" style="padding:4px 14px">${['needs_tow','needs_repair','needs_car','commercial'].map((k,i)=>`<label class="chk"${i===3?' style="border:0"':''}><input type="checkbox" data-c="${k}"${d[k]?' checked':''}>${esc(T.needs[i])}</label>`).join('')}</div>`,
  ()=>`<h1>${esc(T.sign_title)}</h1><p class="sm">${esc(T.sign_hint)}</p>${signBlock()}`
  ];
  const last=n===NSTEPS-1;
  return `${top(T.report,n?null:'home')}<div class="body"><div><span class="sm mut">${esc(T.step_of(n+1,NSTEPS,T.steps[n]))}</span><div class="prog"><i style="width:${(n+1)/NSTEPS*100}%"></i></div></div>${msgBox()}${pages[n]()}</div>
  <div class="foot">${n?`<button class="btn b2" data-step="-1">${esc(T.back)}</button>`:''}${last?`<button class="btn b2" id="submitNoSig"${S.busy?' disabled':''}>${esc(T.sign_later)}</button>`:''}<button class="btn" id="next"${ok&&!S.busy&&(!last||S.sig)?'':' disabled'}>${esc(S.busy?T.sending:last?T.send:T.next)}</button></div>`;
},
case:()=>{
  const {case:c,events,files,parties}=S.cur,T=t();
  const i=STATUS.indexOf(c.status);
  const vdoc=files.find(f=>f.label==='Vollmacht (unterschrieben)');
  return `${top(c.no,'home')}<div class="body">${msgBox()}
  <div class="card"><div class="row"><h2>${esc(tr('types',c.type))}</h2>${pill(c.status)}</div>
    <div class="steps">${STATUS.slice(0,8).map((s,k)=>`<i class="${k<=i&&i<8?'on':''}"></i>`).join('')}</div>
    <dl class="kv"><dt>${esc(T.when)}</dt><dd>${dt(c.when_ts)}</dd><dt>${esc(T.where)}</dt><dd>${esc(c.place||'–')}</dd><dt>${esc(T.vehicle)}</dt><dd dir="ltr">${esc(c.own_plate||'–')}</dd><dt>${esc(T.opponent)}</dt><dd>${esc([c.opp_plate,c.opp_ins].filter(Boolean).join(' · ')||'–')}</dd>
    ${parties.expert?`<dt>${esc(T.expert_p)}</dt><dd>${esc(parties.expert.name)}</dd>`:''}${parties.lawyer?`<dt>${esc(T.lawyer)}</dt><dd>${esc(parties.lawyer.name)}</dd>`:''}${parties.workshop?`<dt>${esc(T.workshop)}</dt><dd>${esc(parties.workshop.name)}</dd>`:''}${parties.rental?`<dt>${esc(T.rental)}</dt><dd>${esc(parties.rental.name)}</dd>`:''}
    ${c.paid_amount!=null?`<dt>${esc(T.paid)}</dt><dd>${eur(c.paid_amount)}</dd>`:''}</dl></div>
  ${c.signed_at?`<div class="card ok"><b>${esc(T.signed_ok)}</b>${vdoc?`<a href="/files/${vdoc.id}" target="_blank" rel="noopener">${esc(T.signed_doc)}</a>`:''}</div>`:`<div class="card warn"><b>${esc(T.sign_card)}</b><span class="sm">${esc(T.sign_card_text)}</span><button class="btn" data-go="sign">${esc(T.sign_now)}</button></div>`}
  ${c.ai&&c.ai.kosten_bis?`<div class="card ai"><b>${esc(T.ai_title)}</b><span>${esc(T.ai_text(Number(c.ai.kosten_von).toLocaleString('de-DE'),Number(c.ai.kosten_bis).toLocaleString('de-DE')))}</span><span class="sm mut">${esc(c.ai.video_reicht===false?T.ai_onsite:T.ai_video)}</span>${(Array.isArray(c.ai.fehlende_fotos)&&c.ai.fehlende_fotos.length)?`<span class="sm">${esc(T.ai_missing)} ${esc(c.ai.fehlende_fotos.map(x=>tr('labels',x)).join(', '))}</span>`:''}</div>`:''}
  ${S.cfg.video&&!['Bezahlt','Abgeschlossen','Abgelehnt'].includes(c.status)?`<div class="card"><b>${esc(T.video_title)}</b><span class="sm">${esc(c.video_at?T.video_at(dt(c.video_at)):T.video_none)}</span><button class="btn" id="video">${esc(T.video_btn)}</button></div>`:''}
  <div class="card"><b>${esc(T.files)}</b>${fileGrid(labelled(files),false)||`<span class="sm mut">${esc(T.none)}</span>`}<label class="btn b2 wide cam">${esc(T.upload_more)}<input type="file" id="more" accept="image/*,video/*,application/pdf" multiple></label></div>
  <div class="card"><b>${esc(T.history)}</b><div class="tl">${events.map(e=>`<div class="ev${e.by_name===S.me.name&&e.kind==='msg'?' me':''}"><span class="mut">${dt(e.created)} · ${esc(e.by_role==='buero'?T.team:e.by_name||T.system)}</span><br>${esc(evText(e))}</div>`).join('')}</div>
    <form id="msgf" style="display:flex;gap:8px"><input type="text" id="msg" placeholder="${esc(T.msg_ph)}" aria-label="${esc(T.msg_ph)}"><button class="btn" type="submit">${esc(T.send_msg)}</button></form></div>
  </div>`;
},
sign:()=>`${top(t().sign_title,'case')}<div class="body">${msgBox()}<p class="sm">${esc(t().sign_hint)}</p>${signBlock()}</div><div class="foot"><button class="btn" id="signsave"${S.sig&&!S.busy?'':' disabled'}>${esc(S.busy?t().sending:t().save)}</button></div>`,
account:()=>{const T=t(),ch=S.cfg.channels||{};return `${top(T.account,'home')}<div class="body">${msgBox()}
  <div class="card"><dl class="kv"><dt>${esc(T.name)}</dt><dd>${esc(S.me.name)}</dd><dt>${esc(T.email)}</dt><dd dir="ltr">${esc(S.me.email)}</dd>${S.me.company?`<dt>${esc(T.company)}</dt><dd>${esc(S.me.company.name)}</dd>`:''}</dl></div>
  <form class="card" id="prefs"><div class="two"><div><label class="l" for="p_lang">${esc(T.language)}</label><select id="p_lang">${LANGS.map(l=>`<option value="${l}"${l===S.lang?' selected':''}>${esc(I[l].langName)}</option>`).join('')}</select></div>
  <div><label class="l" for="p_ch">${esc(T.notify_by)}</label><select id="p_ch">${['email','sms','whatsapp'].filter(k=>k==='email'||ch[k]).map(k=>`<option value="${k}"${S.me.notify_channel===k?' selected':''}>${esc(T.notify[k])}</option>`).join('')}</select></div></div>
  <div><label class="l" for="p_phone">${esc(T.phone)}</label><input id="p_phone" type="tel" dir="ltr" value="${esc(S.me.phone||'')}"></div><button class="btn" type="submit">${esc(T.save)}</button></form>
  <form class="card" id="pwf"><b>${esc(T.change_pw)}</b><div><label class="l" for="p_old">${esc(T.old_pw)}</label><input id="p_old" type="password" autocomplete="current-password" dir="ltr"></div><div><label class="l" for="p_new">${esc(T.new_pw)}</label><input id="p_new" type="password" autocomplete="new-password" dir="ltr"></div><button class="btn" type="submit">${esc(T.save)}</button></form>
  <button class="btn b2 wide" id="logout">${esc(T.logout)}</button>
  ${['buero','firma','anwalt','gutachter','werkstatt','vermietung'].includes(S.me.role)?`<a class="btn wide" href="/portal/">${esc(T.to_portal)}</a>`:''}
</div>`}
};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
const SRLANG={de:'de-DE',tr:'tr-TR',ar:'ar-SA',en:'en-GB'};

function setupPad(){
  const c=document.getElementById('pad');if(!c)return;
  const r=c.getBoundingClientRect(),k=window.devicePixelRatio||1;
  c.width=Math.round(r.width*k);c.height=Math.round(r.height*k);
  const x=c.getContext('2d');x.scale(k,k);if(S.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=S.sig}x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0F172A';
  let down=false,moved=0;
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)});
  c.addEventListener('pointermove',e=>{if(!down)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();moved++});
  const end=()=>{if(!down)return;down=false;if(moved>8){S.sig=c.toDataURL('image/png');const b=document.getElementById(S.view==='sign'?'signsave':'next');if(b&&!S.busy)b.disabled=false}};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
async function loadVText(){
  try{
    if(S.view==='sign')S.vtext=await api(`/api/cases/${S.cur.case.id}/vollmacht`);
    else{const d=S.d,q=new URLSearchParams({name:S.me.name||'',phone:S.me.phone||'',email:S.me.email||'',when:d.when,place:d.place,plate:d.own_plate,opp:[d.opp_plate,d.opp_ins].filter(Boolean).join(', '),rs:d.has_rs});S.vtext=await api('/api/vollmacht-vorlage?'+q)}
  }catch(e){S.vtext={title:'Vollmacht',paras:[e.message]}}
  render();
}

const render=()=>{
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
  document.documentElement.lang=S.lang;document.documentElement.dir=t().dir;
  app.innerHTML=V[S.view]();
  if(document.getElementById('pad'))setupPad()
  if(id&&document.getElementById(id)&&/INPUT|TEXTAREA/.test(document.getElementById(id).tagName)&&document.getElementById(id).type!=='file'){const e=document.getElementById(id);e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}
};
const go=v=>{S.view=v;S.msg='';S.sig=null;if(v==='home'&&location.hash)try{history.replaceState(null,'',location.pathname)}catch(_){}clearInterval(poll);if(v==='new'){S.step=0}if(v==='home')loadCases();if(v==='sign'){S.vtext=null;loadVText()}render();window.scrollTo(0,0)};
const loadCases=async()=>{try{S.cases=(await api('/api/cases')).cases;if(S.view==='home')render()}catch(e){}};
const openCase=async id=>{try{S.cur=await api('/api/cases/'+id);S.view='case';try{history.replaceState(null,'','#fall-'+id)}catch(_){}S.msg='';render();window.scrollTo(0,0);clearInterval(poll);poll=setInterval(async()=>{if(S.view!=='case'||document.activeElement?.id==='msg')return;try{S.cur=await api('/api/cases/'+id);render()}catch(e){}},30000)}catch(e){S.msg={t:e.message};render()}};

async function submitCase(withSig){
  S.busy=true;render();
  const d=S.d,fd=new FormData();
  for(const k of ['type','place','own_plate','injured','police','opp_plate','opp_ins','opp_name','opp_phone','witness','text','fault','has_rs','expert_pref'])fd.append(k,d[k]);
  fd.append('when_ts',String(new Date(d.when).getTime()||Date.now()));fd.append('lang',S.lang);
  for(const k of ['needs_tow','needs_repair','needs_car','commercial'])fd.append(k,d[k]?'1':'0');
  if(withSig&&S.sig)fd.append('signature',S.sig);
  d.photos.forEach(p=>{fd.append('photos',p.file);fd.append('labels',p.label)});
  try{const r=await api('/api/cases',{method:'POST',body:fd});d.photos.forEach(p=>p.preview&&URL.revokeObjectURL(p.preview));S.d=blank();S.busy=false;S.sig=null;await openCase(r.id);S.msg={ok:1,t:t().sent(r.no)};render()}
  catch(err){S.busy=false;S.msg={t:t().send_failed+' '+err.message+' '+t().kept};render()}
}

app.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){go(b.dataset.go);return}
  if(b.dataset.auth){S.authMode=b.dataset.auth;S.msg='';render();return}
  if(b.dataset.open){openCase(b.dataset.open);return}
  if(b.dataset.set){S.d[b.dataset.set]=b.dataset.v;render();return}
  if(b.dataset.lbl){S.label=b.dataset.lbl;render();return}
  if(b.dataset.rm){const p=S.d.photos.splice(+b.dataset.rm,1)[0];if(p?.preview)URL.revokeObjectURL(p.preview);render();return}
  if(b.dataset.step){S.step+=+b.dataset.step;S.msg='';render();window.scrollTo(0,0);return}
  if(b.id==='sigclear'){S.sig=null;render();return}
  if(b.id==='gps'){b.textContent='…';navigator.geolocation.getCurrentPosition(p=>{S.d.place=(S.d.place?S.d.place+' ':'')+`(GPS ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)})`;render()},()=>{b.textContent=t().gps},{enableHighAccuracy:true,timeout:10000});return}
  if(b.id==='mic'){
    if(rec){rec.stop();return}
    rec=new SR();rec.lang=SRLANG[S.lang];rec.continuous=true;rec.interimResults=false;
    rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)S.d.text=(S.d.text?S.d.text+' ':'')+ev.results[i][0].transcript.trim();const ta=document.getElementById('f_tx');if(ta)ta.value=S.d.text};
    rec.onend=()=>{rec=null;const m=document.getElementById('mic');if(m)m.textContent=t().speak};
    try{rec.start();b.textContent=t().stop}catch(_){rec=null}
    return;
  }
  if(b.id==='next'){
    if(S.step<NSTEPS-1){S.step++;S.msg='';if(S.step===NSTEPS-1){S.vtext=null;S.sig=null;loadVText()}render();window.scrollTo(0,0);return}
    submitCase(true);return;
  }
  if(b.id==='submitNoSig'){submitCase(false);return}
  if(b.id==='signsave'){S.busy=true;render();try{await api(`/api/cases/${S.cur.case.id}/sign`,{json:{signature:S.sig}});S.busy=false;await openCase(S.cur.case.id);S.msg={ok:1,t:t().signed_ok};render()}catch(err){S.busy=false;S.msg={t:err.message};render()}return}
  if(b.id==='video'){
    const w=window.open('','_blank');b.textContent=t().video_opening;
    try{const r=await api(`/api/cases/${S.cur.case.id}/video`,{method:'POST'});if(w)w.location=r.url;else location.href=r.url;b.textContent=t().video_btn}
    catch(err){if(w)w.close();S.msg={t:err.message};render()}
    return;
  }
  if(b.id==='logout'){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});S.me=null;S.view='auth';S.msg='';render();return}
});
app.addEventListener('input',e=>{const x=e.target;if(x.dataset.f){S.d[x.dataset.f]=x.value;const nb=document.getElementById('next');if(nb&&S.step===1){const ok=!!(S.d.type&&S.d.place.trim());if(nb.disabled===ok)nb.disabled=!ok}}});
app.addEventListener('change',async e=>{
  const x=e.target;
  if(x.id==='lang'){setLang(x.value);render();return}
  if(x.dataset.c){S.d[x.dataset.c]=x.checked;return}
  if((x.id==='cap'||x.id==='gal')&&x.files.length){
    for(const f of x.files){const s=await shrink(f);const lbl=/^image/.test(f.type)?(x.id==='cap'?S.label:S.label):'Dokument';S.d.photos.push({file:s,label:lbl,preview:/^image/.test(s.type)?URL.createObjectURL(s):null,mime:s.type,original:f.name});
      const have=new Set(S.d.photos.map(p=>p.label)),idx=DE.labels.indexOf(S.label);const nx=DE.labels.slice(idx+1).concat(DE.labels.slice(0,idx)).find(l=>!have.has(l)&&l!=='Dokument');if(nx)S.label=nx}
    render();return;
  }
  if(x.id==='more'&&x.files.length){
    const fd=new FormData();for(const f of x.files){fd.append('files',await shrink(f));fd.append('labels',/^image/.test(f.type)?'Nachgereicht':'Dokument')}
    try{await api(`/api/cases/${S.cur.case.id}/files`,{method:'POST',body:fd});await openCase(S.cur.case.id);S.msg={ok:1,t:t().uploaded};render()}catch(err){S.msg={t:err.message};render()}
  }
});
app.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,v=id=>document.getElementById(id)?.value||'';
  try{
    if(f.id==='authf'){
      if(S.authMode==='login')await api('/api/auth/login',{json:{email:v('a_mail'),password:v('a_pw')}});
      else await api('/api/auth/register',{json:{email:v('a_mail'),password:v('a_pw'),name:v('a_name'),phone:v('a_phone'),lang:S.lang}});
      await boot();
    }
    if(f.id==='msgf'){const text=v('msg').trim();if(!text)return;await api(`/api/cases/${S.cur.case.id}/events`,{json:{text}});await openCase(S.cur.case.id)}
    if(f.id==='pwf'){await api('/api/me/password',{json:{old:v('p_old'),password:v('p_new')}});S.msg={ok:1,t:t().pw_changed};render()}
    if(f.id==='prefs'){await api('/api/me',{method:'PATCH',json:{lang:v('p_lang'),notify_channel:v('p_ch'),phone:v('p_phone')}});setLang(v('p_lang'));S.me=(await api('/api/me')).user;S.msg={ok:1,t:t().saved};render()}
  }catch(err){S.msg={t:err.message};render()}
});

async function boot(){
  try{S.cfg=await api('/api/config')}catch(e){}
  try{S.me=(await api('/api/me')).user}catch(e){S.me=null}
  if(!S.me){S.view='auth';render();return}
  if(S.me.lang&&LANGS.includes(S.me.lang)&&!store.get('kf_lang'))setLang(S.me.lang);
  S.msg='';
  const m=location.hash.match(/^#fall-(\d+)$/);
  if(m){await openCase(m[1]);return}
  go('home');
}
setLang(S.lang);
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/app/sw.js').catch(()=>{});
}
</script>
</body>
