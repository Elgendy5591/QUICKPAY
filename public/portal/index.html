<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/icon.svg">
<title>Klarfall Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
aside{flex:1 1 230px;max-width:250px;background:#0F172A;color:#cbd5e1;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
aside .logo{font:700 19px 'Space Grotesk',sans-serif;color:#fff;padding:0 10px 4px}
aside .who{font-size:13px;color:#94a3b8;padding:0 10px 16px}
aside a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:500;font-size:15px}
aside a:hover{background:#1e293b;color:#fff}
aside a[aria-current=page]{background:#1F4FD8;color:#fff}
aside .bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
main{flex:999 1 560px;min-width:0;padding:24px clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:700 26px 'Space Grotesk',sans-serif;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input{flex:1 1 220px}
.bar .opt{min-height:42px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
@media(max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){aside{max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}aside .who{display:none}aside .logo{padding:0 10px 0 4px}aside .bottom{margin:0;flex-direction:row}}
@media print{aside,.noprint{display:none!important}main{padding:0}}
</style>
</head>
<body>
<div id="root"><main><p class="mut">Wird geladen …</p></main></div>
<script src="/assets/api.js"></script>
<script>
{
const {esc,eur,dt,STATUS,pill,api,shrink,fileGrid}=KF;
const root=document.getElementById('root');
const ROLE_NAME={buero:'Büro',firma:'Firma',anwalt:'Kanzlei',gutachter:'Sachverständiger',werkstatt:'Werkstatt',vermietung:'Autovermietung',kunde:'Kunde',fahrer:'Fahrer'};
const S={cfg:{},me:null,route:'faelle',cases:[],stats:null,filter:'open',q:'',cur:null,users:[],companies:[],partners:[],msg:'',created:null};

const nav=()=>{
  const r=S.me.role,items=[['faelle',r==='buero'||r==='firma'?'Fälle':'Meine Aufträge']];
  if(r==='buero')items.push(['nutzer','Benutzer'],['firmen','Firmen']);
  items.push(['konto','Konto']);
  const cur=S.route.startsWith('fall-')?'faelle':S.route;
  return `<aside><div class="logo">Klarfall</div><div class="who">${esc(S.me.name)} · ${esc(ROLE_NAME[r])}${S.me.company?' · '+esc(S.me.company.name):''}</div>
  ${items.map(([k,t])=>`<a href="#${k}" aria-current="${cur===k?'page':'false'}">${t}</a>`).join('')}
  <div class="bottom"><a href="/">Webseite</a><a href="#" id="logout">Abmelden</a></div></aside>`;
};
const msg=()=>S.msg?`<div class="note ${S.msg.ok?'ok':'err'}" role="status">${esc(S.msg.t)}</div>`:'';


function extraPanels(){
  const {case:c,files}=S.cur,role=S.me.role;
  const vdoc=files.find(f=>f.label==='Vollmacht (unterschrieben)');
  let h=`<div class="card"><h2>Vollmacht</h2>${c.signed_at?`<span>Unterschrieben am ${dt(c.signed_at)}</span>${vdoc?`<a href="/files/${vdoc.id}" target="_blank" rel="noopener">PDF öffnen</a>`:''}`:`<span class="pill" style="align-self:flex-start;background:#FEF3C7;color:#92400E">Noch nicht unterschrieben</span><span class="sm mut">Der Kunde kann in der App unterschreiben.</span>`}</div>`;
  if(S.cfg.video&&['buero','gutachter','anwalt'].includes(role)){
    h+=`<div class="card noprint"><h2>Video-Gutachten</h2><span class="sm">${c.video_at?'Termin: '+dt(c.video_at):'Kein Termin eingetragen.'}</span><button class="btn" id="video">Videocall starten</button></div>`;
  }
  if(['buero','gutachter'].includes(role)&&(S.cfg.ai||c.ai)){
    const a=c.ai,L=x=>Array.isArray(x)?x.map(o=>o&&typeof o==='object'?[o.teil,[o.schaden,o.massnahme].filter(Boolean).join(', ')].filter(Boolean).join(': '):o).join(' · '):(x||''),yn=x=>x===true?'Ja':x===false?'Nein':'–';
    h+=`<div class="card"><div class="row"><h2>KI-Ersteinschätzung</h2>${c.ai_status?`<span class="pill">${esc(c.ai_status)}</span>`:''}</div>
    ${a?`<dl class="kv"><dt>Kosten</dt><dd>${eur(a.kosten_von)} – ${eur(a.kosten_bis)}</dd><dt>Schwere</dt><dd>${esc(a.schwere||'–')}</dd><dt>Teile</dt><dd>${esc(L(a.teile)||'–')}</dd>
    <dt>Video reicht</dt><dd>${yn(a.video_reicht)}</dd><dt>Totalschaden möglich</dt><dd>${yn(a.totalschaden_moeglich)}</dd><dt>Plausibel</dt><dd>${yn(a.plausibel)}</dd>
    <dt>Auffälligkeiten</dt><dd>${esc(L(a.auffaelligkeiten)||'–')}</dd><dt>Versteckte Schäden</dt><dd>${esc(L(a.versteckte_schaeden)||'–')}</dd>
    <dt>Fotoqualität</dt><dd>${esc(a.foto_qualitaet||'–')}</dd><dt>Fehlende Fotos</dt><dd>${esc(L(a.fehlende_fotos)||'–')}</dd></dl>
    ${a.zusammenfassung?`<div class="ev">${esc(a.zusammenfassung)}</div>`:''}<span class="sm mut">Nur eine Ersteinschätzung, sie ersetzt kein Gutachten.</span>`:'<span class="sm mut">Noch keine Analyse.</span>'}
    ${S.cfg.ai?`<button class="btn b2 noprint" id="airun">${a?'KI-Analyse neu starten':'KI-Analyse starten'}</button>`:''}</div>`;
  }
  return h;
}
const V={
setup:()=>`<div class="auth"><div class="card"><h1>Ersteinrichtung</h1><p class="sm">Noch gibt es keinen Büro-Zugang. Lege ihn hier einmalig an. Danach ist diese Seite gesperrt.</p>${msg()}
  <form id="setupf" style="display:flex;flex-direction:column;gap:12px"><div><label class="l" for="s_code">Einrichtungs-Code</label><input id="s_code" type="text" autocomplete="off" required></div>
  <div><label class="l" for="s_name">Name</label><input id="s_name" type="text" autocomplete="name" required></div>
  <div><label class="l" for="s_mail">E-Mail</label><input id="s_mail" type="email" autocomplete="email" required></div>
  <div><label class="l" for="s_pw">Passwort (mind. 10 Zeichen)</label><input id="s_pw" type="password" autocomplete="new-password" minlength="10" required></div><button class="btn wide">Büro-Zugang anlegen</button></form></div></div>`,
login:()=>`<div class="auth"><div class="card"><h1>Klarfall Portal</h1><p class="sm mut">Für Büro, Firmen, Kanzleien, Sachverständige, Werkstätten und Vermieter.</p>${msg()}
  <form id="loginf" style="display:flex;flex-direction:column;gap:12px"><div><label class="l" for="l_mail">E-Mail</label><input id="l_mail" type="email" autocomplete="email" required></div>
  <div><label class="l" for="l_pw">Passwort</label><input id="l_pw" type="password" autocomplete="current-password" required></div><button class="btn wide">Anmelden</button></form>
  <p class="sm mut">Kunden und Fahrer: bitte die <a href="/app/">App</a> nutzen.</p></div></div>`,
faelle:()=>{
  const s=S.stats||{},r=S.me.role;
  return `<div class="row"><h1>${r==='buero'?'Alle Fälle':r==='firma'?'Fälle unserer Flotte':'Meine Aufträge'}</h1>${['buero','firma'].includes(r)?`<a class="btn b2" href="/api/export.csv">Export CSV (Excel)</a>`:''}</div>
  ${msg()}
  <div class="kpis"><div class="kpi"><span class="sm mut">Neu</span><b style="color:var(--red)">${s.neu||0}</b></div><div class="kpi"><span class="sm mut">Offen</span><b>${s.offen||0}</b></div><div class="kpi"><span class="sm mut">Gesamt</span><b>${s.total||0}</b></div>
  ${['buero','firma'].includes(r)?`<div class="kpi"><span class="sm mut">Gefordert</span><b>${eur(s.gefordert)}</b></div><div class="kpi"><span class="sm mut">Noch offen</span><b style="color:var(--amber)">${eur((s.gefordert||0)-(s.bezahlt||0))}</b></div><div class="kpi"><span class="sm mut">Ausfalltage</span><b>${s.ausfalltage||0}</b></div>`:''}</div>
  <div class="bar"><input type="search" id="q" placeholder="Suchen: Fall-Nr., Kennzeichen, Name, Ort" value="${esc(S.q)}" aria-label="Suchen">
  ${[['open','Offen'],['Neu','Neu'],['all','Alle'],['done','Erledigt']].map(([k,t])=>`<button class="opt" data-filter="${k}" aria-pressed="${S.filter===k}">${t}</button>`).join('')}</div>
  <div class="card" style="padding:0"><div class="scroll"><table><thead><tr><th>Fall</th><th>Status</th><th>Unfall</th><th>Kunde / Fahrer</th>${r==='buero'?'<th>Firma</th>':''}<th>Kennzeichen</th><th class="num">Gefordert</th><th class="num">Bezahlt</th><th>Aktualisiert</th></tr></thead>
  <tbody>${S.cases.map(c=>`<tr data-open="${c.id}" tabindex="0"><td><b>${esc(c.no)}</b></td><td>${pill(c.status)}</td><td>${esc(c.type)}<br><span class="sm mut">${dt(c.when_ts)}</span></td><td>${esc(c.customer_name||'–')}</td>${r==='buero'?`<td>${esc(c.company_name||'Privat')}</td>`:''}<td>${esc(c.own_plate||'–')}</td><td class="num">${eur(c.claim_amount)}</td><td class="num">${eur(c.paid_amount)}</td><td class="sm">${dt(c.updated)}</td></tr>`).join('')}</tbody></table></div>
  ${S.cases.length?'':`<div class="empty">Keine Fälle für diese Auswahl.</div>`}</div>`;
},
fall:()=>{
  const {case:c,events,files,parties}=S.cur,r=S.me.role,office=r==='buero';
  const i=STATUS.indexOf(c.status);
  const sel=(col,role)=>`<select id="e_${col}"><option value="">– keiner –</option>${S.partners.filter(p=>p.role===role).map(p=>`<option value="${p.id}"${c[col]===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  const val=(k)=>`value="${esc(c[k]??'')}"`;
  return `<div class="row noprint"><a href="#faelle">← Alle Fälle</a><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn b2" id="copy">Text kopieren</button><button class="btn b2" id="print">Drucken / PDF</button></div></div>
  <div class="row"><h1>${esc(c.no)}</h1>${pill(c.status)}</div>
  <div class="steps">${STATUS.slice(0,8).map((s,k)=>`<i class="${k<=i&&i<8?'on':''}"></i>`).join('')}</div>
  ${msg()}
  <div class="grid">
   <div style="display:flex;flex-direction:column;gap:18px">
    <div class="card"><h2>Unfall</h2><dl class="kv">
      <dt>Art</dt><dd>${esc(c.type)}</dd><dt>Wann</dt><dd>${dt(c.when_ts)}</dd><dt>Wo</dt><dd>${esc(c.place||'–')}</dd>
      <dt>Fahrzeug</dt><dd>${esc(c.own_plate||'–')}${c.commercial?' · gewerblich':''}</dd><dt>Verletzte</dt><dd>${esc(c.injured||'–')}</dd><dt>Polizei</dt><dd>${esc(c.police||'–')}</dd>
      <dt>Kunde</dt><dd>${esc(parties.customer?.name||'–')}${parties.company?' · '+esc(parties.company.name):''}<br><span class="sm">${esc([parties.customer?.phone,parties.customer?.email].filter(Boolean).join(' · '))}</span></dd>
      <dt>Gegner</dt><dd>${esc([c.opp_plate,c.opp_ins,c.opp_name,c.opp_phone].filter(Boolean).join(' · ')||'–')}</dd><dt>Zeugen</dt><dd>${esc(c.witness||'–')}</dd>
      <dt>Schuld (Kunde)</dt><dd>${esc(c.fault||'–')}</dd><dt>Rechtsschutz</dt><dd>${esc(c.has_rs||'–')}</dd><dt>Gutachten</dt><dd>${esc(c.expert_pref||'–')}</dd>
      <dt>Braucht</dt><dd>${esc([c.needs_tow&&'Abschleppen',c.needs_repair&&'Werkstatt',c.needs_car&&'Ersatzfahrzeug'].filter(Boolean).join(', ')||'–')}</dd>
      <dt>Beteiligte</dt><dd>${esc([parties.expert&&'Gutachter: '+parties.expert.name,parties.lawyer&&'Anwalt: '+parties.lawyer.name,parties.workshop&&'Werkstatt: '+parties.workshop.name,parties.rental&&'Vermietung: '+parties.rental.name].filter(Boolean).join(' · ')||'–')}</dd>
      <dt>Haftung</dt><dd>${esc(c.liability||'–')}</dd><dt>Schaden-Nr.</dt><dd>${esc(c.claim_no||'–')}</dd>
      <dt>Schaden / gefordert / bezahlt</dt><dd>${eur(c.damage_amount)} / ${eur(c.claim_amount)} / ${eur(c.paid_amount)}</dd><dt>Ausfalltage</dt><dd>${esc(c.days_off??'–')}</dd>
    </dl>${c.text?`<div class="ev"><b class="sm">Hergang</b><br>${esc(c.text)}</div>`:''}</div>
    <div class="card"><h2>Fotos &amp; Dokumente (${files.length})</h2>${fileGrid(files,false)||'<span class="sm mut">Keine.</span>'}
      <form id="upf" class="noprint" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><input type="text" id="up_label" placeholder="Bezeichnung, z. B. Gutachten" style="flex:1 1 200px"><input type="file" id="up_files" multiple accept="image/*,application/pdf,video/*" style="flex:1 1 200px"><button class="btn" type="submit">Hochladen</button></form></div>
   </div>
   <div style="display:flex;flex-direction:column;gap:18px">
    ${extraPanels()}
    ${office?`<form class="card noprint" id="editf"><h2>Bearbeiten</h2>
      <div class="two"><div><label class="l" for="e_status">Status</label><select id="e_status">${STATUS.map(s=>`<option${s===c.status?' selected':''}>${esc(s)}</option>`).join('')}</select></div>
      <div><label class="l" for="e_company_id">Firma</label><select id="e_company_id"><option value="">Privat</option>${S.companies.map(co=>`<option value="${co.id}"${c.company_id===co.id?' selected':''}>${esc(co.name)}</option>`).join('')}</select></div>
      <div><label class="l" for="e_expert_id">Sachverständiger</label>${sel('expert_id','gutachter')}</div><div><label class="l" for="e_lawyer_id">Anwalt</label>${sel('lawyer_id','anwalt')}</div>
      <div><label class="l" for="e_workshop_id">Werkstatt</label>${sel('workshop_id','werkstatt')}</div><div><label class="l" for="e_rental_id">Vermietung</label>${sel('rental_id','vermietung')}</div>
      <div><label class="l" for="e_liability">Haftung</label><input id="e_liability" type="text" placeholder="z. B. 100 % Gegner" ${val('liability')}></div><div><label class="l" for="e_claim_no">Schaden-Nr.</label><input id="e_claim_no" type="text" ${val('claim_no')}></div>
      <div><label class="l" for="e_damage_amount">Schaden laut Gutachten (€)</label><input id="e_damage_amount" type="number" step="0.01" ${val('damage_amount')}></div><div><label class="l" for="e_claim_amount">Gefordert (€)</label><input id="e_claim_amount" type="number" step="0.01" ${val('claim_amount')}></div>
      <div><label class="l" for="e_paid_amount">Bezahlt (€)</label><input id="e_paid_amount" type="number" step="0.01" ${val('paid_amount')}></div><div><label class="l" for="e_days_off">Ausfalltage</label><input id="e_days_off" type="number" ${val('days_off')}></div></div>
      ${S.cfg.video?`<div><label class="l" for="e_video_at">Videotermin</label><input id="e_video_at" type="datetime-local" value="${c.video_at?new Date(c.video_at-new Date(c.video_at).getTimezoneOffset()*6e4).toISOString().slice(0,16):''}"></div>`:''}
      <div><label class="l" for="e_note_internal">Interne Notiz (nur Büro)</label><textarea id="e_note_internal">${esc(c.note_internal||'')}</textarea></div>
      <button class="btn" type="submit">Speichern</button></form>`:''}
    <div class="card"><h2>Verlauf &amp; Nachrichten</h2><p class="sm mut">${office?'Nachrichten sehen alle Beteiligten des Falls, außer sie sind als intern markiert.':'Nachrichten sehen das Klarfall-Team, der Kunde und die anderen Partner dieses Falls.'}</p>
      <div class="tl">${events.map(e=>`<div class="ev${e.internal?' int':''}"><span class="mut">${dt(e.created)} · ${esc(e.by_name||'System')}${e.by_role?' ('+esc(ROLE_NAME[e.by_role]||e.by_role)+')':''}${e.internal?' · intern':''}</span><br>${esc(e.text)}</div>`).join('')}</div>
      <form id="msgf" class="noprint" style="display:flex;flex-direction:column;gap:8px"><textarea id="m_text" placeholder="Nachricht schreiben" style="min-height:70px"></textarea>
      <div class="row">${office?`<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="m_int" style="width:20px;height:20px">Nur intern</label>`:'<span></span>'}<button class="btn" type="submit">Senden</button></div></form></div>
   </div>
  </div>`;
},
nutzer:()=>`<h1>Benutzer</h1>${msg()}
  ${S.created?`<div class="note ok">Zugang angelegt für <b>${esc(S.created.email)}</b>. Startpasswort: <b>${esc(S.created.password)}</b> – bitte weitergeben (wird nur jetzt angezeigt; mit SMTP auch per E-Mail).</div>`:''}
  <form class="card" id="userf"><h2>Neuer Zugang</h2><div class="three">
    <div><label class="l" for="u_role">Rolle</label><select id="u_role">${Object.entries(ROLE_NAME).filter(([k])=>k!=='kunde').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    <div><label class="l" for="u_name">Name / Firma</label><input id="u_name" type="text" required></div>
    <div><label class="l" for="u_mail">E-Mail</label><input id="u_mail" type="email" required></div>
    <div><label class="l" for="u_phone">Telefon</label><input id="u_phone" type="tel"></div>
    <div><label class="l" for="u_co">Firma (für Fahrer / Firma)</label><select id="u_co"><option value="">–</option>${S.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
  </div><button class="btn" type="submit" style="align-self:flex-start">Anlegen</button></form>
  <div class="card" style="padding:0"><div class="scroll"><table><thead><tr><th>Name</th><th>Rolle</th><th>E-Mail</th><th>Telefon</th><th>Firma</th><th>Status</th><th></th></tr></thead><tbody>
  ${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(ROLE_NAME[u.role])}</td><td>${esc(u.email)}</td><td>${esc(u.phone||'')}</td><td>${esc(u.company_name||'')}</td><td>${u.active?pill('Aktiv').replace('s1','s3'):'<span class="pill s0">Gesperrt</span>'}</td><td>${u.id===S.me.id?'':`<button class="btn b2" style="min-height:36px" data-toggle="${u.id}" data-active="${u.active?0:1}">${u.active?'Sperren':'Entsperren'}</button>`}</td></tr>`).join('')}
  </tbody></table></div></div>`,
firmen:()=>`<h1>Firmen</h1>${msg()}
  <form class="card" id="cof" style="flex-direction:row;flex-wrap:wrap;align-items:flex-end"><div style="flex:1 1 260px"><label class="l" for="co_name">Neue Firma</label><input id="co_name" type="text" required></div><button class="btn" type="submit">Anlegen</button></form>
  <div class="card" style="padding:0"><div class="scroll"><table><thead><tr><th>Firma</th><th class="num">Zugänge</th><th class="num">Fälle</th></tr></thead><tbody>${S.companies.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${c.users}</td><td class="num">${c.cases}</td></tr>`).join('')}</tbody></table></div>${S.companies.length?'':'<div class="empty">Noch keine Firmen.</div>'}</div>
  <p class="sm mut">Danach unter „Benutzer“ einen Zugang mit Rolle „Firma“ (sieht alle Fälle der Firma) und für jeden Fahrer die Rolle „Fahrer“ anlegen.</p>`,
konto:()=>`<h1>Konto</h1>${msg()}<div class="card"><dl class="kv"><dt>Name</dt><dd>${esc(S.me.name)}</dd><dt>E-Mail</dt><dd>${esc(S.me.email)}</dd><dt>Rolle</dt><dd>${esc(ROLE_NAME[S.me.role])}</dd></dl></div>
  <form class="card" id="pwf" style="max-width:480px"><h2>Passwort ändern</h2><div><label class="l" for="p_old">Altes Passwort</label><input id="p_old" type="password" autocomplete="current-password"></div><div><label class="l" for="p_new">Neues Passwort (mind. 8 Zeichen)</label><input id="p_new" type="password" autocomplete="new-password"></div><button class="btn" type="submit">Speichern</button></form>`
};

const render=()=>{
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
  if(!S.me){root.innerHTML=S.setup?V.setup():V.login();return}
  const view=S.route.startsWith('fall-')?'fall':S.route;
  root.innerHTML=`<div class="shell">${nav()}<main>${(V[view]||V.faelle)()}</main></div>`;
  if(id==='q'){const e=document.getElementById('q');e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}
};

const loadList=async()=>{
  const p=new URLSearchParams();if(S.filter==='open')p.set('open','1');else if(S.filter==='Neu')p.set('status','Neu');if(S.q)p.set('q',S.q);
  try{let cs=(await api('/api/cases?'+p)).cases;if(S.filter==='done')cs=cs.filter(c=>['Bezahlt','Abgeschlossen','Abgelehnt'].includes(c.status));S.cases=cs;S.stats=await api('/api/stats')}catch(e){S.msg={t:e.message}}
};
const route=async()=>{
  if(!S.me)return render();
  S.route=(location.hash.slice(1)||'faelle');
  const r=S.route;
  if(r.startsWith('fall-')){
    try{S.cur=await api('/api/cases/'+r.slice(5));if(S.me.role==='buero'&&!S.partners.length){S.partners=(await api('/api/partners')).partners;S.companies=(await api('/api/companies')).companies}}
    catch(e){S.msg={t:e.message};location.hash='faelle';return}
  }else if(r==='nutzer'&&S.me.role==='buero'){S.users=(await api('/api/users')).users;S.companies=(await api('/api/companies')).companies}
  else if(r==='firmen'&&S.me.role==='buero'){S.companies=(await api('/api/companies')).companies}
  else if(r!=='konto'){S.route='faelle';await loadList()}
  render();window.scrollTo(0,0);
};
window.addEventListener('hashchange',()=>{S.msg='';S.created=null;route()});

let qT=null;
root.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;clearTimeout(qT);qT=setTimeout(async()=>{await loadList();render()},300)}});
root.addEventListener('click',async e=>{
  const tr=e.target.closest('tr[data-open]');if(tr){location.hash='fall-'+tr.dataset.open;return}
  const t=e.target.closest('button,a');if(!t)return;
  if(t.id==='logout'){e.preventDefault();await api('/api/auth/logout',{method:'POST'}).catch(()=>{});S.me=null;location.hash='';render();return}
  if(t.dataset.filter){S.filter=t.dataset.filter;await loadList();render();return}
  if(t.id==='print'){window.print();return}
  if(t.id==='video'){const w=window.open('','_blank');t.textContent='Wird geöffnet …';try{const r=await api(`/api/cases/${S.cur.case.id}/video`,{method:'POST'});if(w)w.location=r.url;else location.href=r.url;t.textContent='Videocall starten'}catch(err){if(w)w.close();S.msg={t:err.message};render()}return}
  if(t.id==='airun'){t.disabled=true;t.textContent='Läuft …';try{await api(`/api/cases/${S.cur.case.id}/ai`,{method:'POST'});S.msg={ok:1,t:'KI-Analyse gestartet. Ergebnis erscheint in etwa einer Minute.'};setTimeout(()=>{if(S.route==='fall-'+S.cur.case.id)route()},20000);await route()}catch(err){S.msg={t:err.message};render()}return}
  if(t.id==='copy'){
    const {case:c,files,parties}=S.cur;
    const txt=[`Fall ${c.no} (${c.status})`,`Unfall: ${c.type}, ${dt(c.when_ts)}, ${c.place||''}`,`Fahrzeug: ${c.own_plate||'–'}${c.commercial?' (gewerblich)':''}`,`Kunde: ${parties.customer?.name||'–'}, ${parties.customer?.phone||''} ${parties.customer?.email||''}`,`Gegner: ${[c.opp_plate,c.opp_ins,c.opp_name,c.opp_phone].filter(Boolean).join(', ')||'–'}`,`Zeugen: ${c.witness||'–'}`,`Polizei: ${c.police||'–'}`,`Hergang: ${c.text||'–'}`,`Schuld laut Kunde: ${c.fault||'–'} · Rechtsschutz: ${c.has_rs||'–'}`,`Fotos/Dokumente: ${files.length} – ${location.origin}/portal/#fall-${c.id}`].join('\n');
    try{await navigator.clipboard.writeText(txt);t.textContent='Kopiert ✓'}catch(_){t.textContent='Kopieren nicht möglich'}return;
  }
  if(t.dataset.toggle){try{await api('/api/users/'+t.dataset.toggle,{method:'PATCH',json:{active:t.dataset.active==='1'}});route()}catch(err){S.msg={t:err.message};render()}return}
});
root.addEventListener('keydown',e=>{const tr=e.target.closest&&e.target.closest('tr[data-open]');if(tr&&e.key==='Enter')location.hash='fall-'+tr.dataset.open});
root.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,v=id=>document.getElementById(id)?.value??'';
  try{
    if(f.id==='setupf'){await api('/api/setup',{json:{code:v('s_code').trim(),name:v('s_name'),email:v('s_mail'),password:v('s_pw')}});S.setup=false;return boot()}
    if(f.id==='loginf'){await api('/api/auth/login',{json:{email:v('l_mail'),password:v('l_pw')}});return boot()}
    if(f.id==='editf'){
      const body={};['status','company_id','expert_id','lawyer_id','workshop_id','rental_id','liability','claim_no','damage_amount','claim_amount','paid_amount','days_off','note_internal'].forEach(k=>body[k]=v('e_'+k));
      if(document.getElementById('e_video_at')){const x=v('e_video_at');body.video_at=x?new Date(x).getTime():null}
      await api('/api/cases/'+S.cur.case.id,{method:'PATCH',json:body});S.msg={ok:1,t:'Gespeichert.'};await route();return;
    }
    if(f.id==='msgf'){const text=v('m_text').trim();if(!text)return;await api(`/api/cases/${S.cur.case.id}/events`,{json:{text,internal:document.getElementById('m_int')?.checked}});await route();return}
    if(f.id==='upf'){const files=document.getElementById('up_files').files;if(!files.length)return;const fd=new FormData();const lbl=v('up_label')||'Dokument';for(const x of files){fd.append('files',await shrink(x));fd.append('labels',lbl)}f.querySelector('button').disabled=true;await api(`/api/cases/${S.cur.case.id}/files`,{method:'POST',body:fd});S.msg={ok:1,t:'Hochgeladen.'};await route();return}
    if(f.id==='userf'){const r=await api('/api/users',{json:{role:v('u_role'),name:v('u_name'),email:v('u_mail'),phone:v('u_phone'),company_id:v('u_co')}});S.created={email:v('u_mail'),password:r.password};await route();return}
    if(f.id==='cof'){await api('/api/companies',{json:{name:v('co_name')}});S.msg={ok:1,t:'Firma angelegt.'};await route();return}
    if(f.id==='pwf'){await api('/api/me/password',{json:{old:v('p_old'),password:v('p_new')}});S.msg={ok:1,t:'Passwort geändert.'};render();return}
  }catch(err){S.msg={t:err.message};render()}
});

async function boot(){
  try{S.cfg=await api('/api/config')}catch(e){S.cfg={}}
  try{S.me=(await api('/api/me')).user}catch(e){S.me=null}
  if(!S.me){try{S.setup=(await api('/api/setup')).needed}catch(e){S.setup=false}}
  if(S.me&&['kunde','fahrer'].includes(S.me.role)){location.href='/app/';return}
  S.msg='';route();
}
setInterval(()=>{if(S.me&&S.route==='faelle'&&document.activeElement?.id!=='q'){loadList().then(render)}},60000);
boot();
}
</script>
</body>
</html>
